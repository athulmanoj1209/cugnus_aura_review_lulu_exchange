<div class="add-obs-content">

  <!-- HEADER -->
  <div class="drawer-header">
    <div class="drawer-header-left">
      <div class="drawer-icon-wrap">
        <i class="pi" [ngClass]="isApprove ? drawerIcons.Approve : drawerIcons.Default"></i>
      </div>
      <div class="drawer-title-block">
        <h2 class="drawer-title">{{ headerTitle }}</h2>
        <p class="drawer-subtitle">{{ headerSubtitle }}</p>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="onCancel()">
      <app-draw-icon icon="pi pi-times"></app-draw-icon>
    </button>
  </div>

  <!-- APPROVE BANNER -->
  <div *ngIf="isApprove" class="approve-banner">
    <app-draw-icon icon="pi pi-info-circle"></app-draw-icon>
    <span i18n="@@audit.observations.approveBanner">You may edit the observation details. Add your <strong>approver notes</strong> below and approve or reject.</span>
  </div>

  <!-- FORM -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="drawer-body">
    <div class="form-grid">

      <!-- Title -->
      <div class="form-field form-field--full">
        <label class="form-label"><span i18n="@@audit.observations.observationStatementRequired">Observation Statement</span> *</label>
        <input pInputText formControlName="title" placeholder="Enter the observation statement…"
               [invalid]="isInvalid('title')" i18n-placeholder="@@audit.observations.observationStatementPlaceholder" />
        <small *ngIf="getError('title',titleLabel) as e" class="error-text">{{ e }}</small>
      </div>
<!-- Company -->
      <div class="form-field">
        <label class="form-label" i18n="@@common.company">Company</label>
        <p-select formControlName="company" [options]="companyOptions()"
                  optionLabel="label" optionValue="value" placeholder="Select company" i18n-placeholder="@@audit.observations.selectCompany"
                  styleClass="w-full"></p-select>
      </div>

      <!-- Division -->
      <div class="form-field">
        <label class="form-label" i18n="@@common.division">Division</label>
        <p-select formControlName="division" [options]="divisionOptions()"
                  optionLabel="label" optionValue="value"
                  [placeholder]="form.get('company')?.value ? placeholders.Division : placeholders.CompanyFirst"
                  [disabled]="!form.get('company')?.value"
                  styleClass="w-full"></p-select>
      </div>

      <!-- Sub-Division -->
      <div class="form-field">
        <label class="form-label">
          <span i18n="@@common.subDivision">Sub-Division</span>
          <span *ngIf="subDivisionOptions().length"> *</span>
        </label>
        <p-select formControlName="subDivision" [options]="subDivisionOptions()"
                  optionLabel="label" optionValue="value"
                  [placeholder]="!form.get('division')?.value ? placeholders.DivisionFirst
                                 : divisionHasSubDivision() ? placeholders.SubDivision : placeholders.NoSubDivisions"
                  [disabled]="!form.get('division')?.value || !divisionHasSubDivision()"
                  [invalid]="isInvalid('subDivision')" styleClass="w-full"></p-select>
        <small *ngIf="getError('subDivision',subDivisionLabel) as err" class="error-text">{{ err }}</small>
      </div>


      <!-- Scope -->
      <div class="form-field">
        <label class="form-label"><span i18n="@@common.scope">Scope</span> *</label>
        <p-select formControlName="scope" [options]="scopeOptions()" optionLabel="label" optionValue="value"
                  [placeholder]="scopeSelectable() ? placeholders.Scope : placeholders.SubDivisionFirst"
                  [disabled]="!scopeSelectable()"
                  [invalid]="isInvalid('scope')" styleClass="w-full"></p-select>
        <small *ngIf="getError('scope',scopeLabel) as e" class="error-text">{{ e }}</small>
      </div>

      <!-- Subscope (optional when the selected scope has no sub-scopes defined) -->
      <div class="form-field">
        <label class="form-label" i18n="@@common.subScope">Sub-Scope</label>
        <p-select formControlName="subscope" [options]="subscopeOptions()" optionLabel="label" optionValue="value"
                  [placeholder]="!form.get('scope')?.value ? placeholders.ScopeFirst : (subscopeOptions().length ? placeholders.Subscope : placeholders.NoSubscopes)"
                  [disabled]="!form.get('scope')?.value || !subscopeOptions().length"
                  [invalid]="isInvalid('subscope')" styleClass="w-full"></p-select>
        <small *ngIf="getError('subscope',subScopeLabel) as e" class="error-text">{{ e }}</small>
      </div>

      <!-- Task -->
      <div class="form-field">
        <label class="form-label"><span i18n="@@audit.findings.task">Task</span> *</label>
        <p-select formControlName="taskId" [options]="taskOptions()" optionLabel="label" optionValue="value"
                  [placeholder]="!form.get('scope')?.value ? placeholders.ScopeFirst : placeholders.Task"
                  [disabled]="!form.get('scope')?.value"
                  [invalid]="isInvalid('taskId')" styleClass="w-full"></p-select>
        <small *ngIf="getError('taskId',taskLabel) as err" class="error-text">{{ err }}</small>
      </div>

      <!-- Risk Rating -->
      <div class="form-field">
        <label class="form-label"><span i18n="@@audit.observations.riskRating">Risk Rating</span> *</label>
        <p-select formControlName="riskRating" [options]="riskOptions" optionLabel="label" optionValue="value"
                  placeholder="Select risk rating" i18n-placeholder="@@audit.observations.selectRiskRating" [invalid]="isInvalid('riskRating')" styleClass="w-full"></p-select>
        <small *ngIf="getError('riskRating',riskRatingLabel) as e" class="error-text">{{ e }}</small>
      </div>

      <!-- Linked Evidence -->
      <div class="form-field form-field--full">
        <label class="form-label" i18n="@@audit.observations.linkedEvidence">Linked Evidence</label>
        <p-multiSelect formControlName="evidenceIds" [options]="evidenceOptions"
                       optionLabel="label" optionValue="value"
                       placeholder="Select supporting evidence"
                       i18n-placeholder="@@audit.observations.selectSupportingEvidence"
                       display="chip" [showHeader]="false" styleClass="w-full"></p-multiSelect>
      </div>

      <!-- Description -->
      <div class="form-field form-field--full">
        <label class="form-label"><span i18n="@@audit.observations.detailedNotes">Detailed Notes</span> *</label>
        <textarea pTextarea formControlName="description"
                  placeholder="Describe the observation in detail…"
                  i18n-placeholder="@@audit.observations.descriptionPlaceholder"
                  [autoResize]="true" rows="6"
                  [class.ng-invalid]="isInvalid('description')"
                  [class.ng-touched]="isInvalid('description')"></textarea>
        <small *ngIf="getError('description',notesLabel) as e" class="error-text">{{ e }}</small>
      </div>

    </div>

    <!-- ── APPROVER NOTES (approve mode only) ─────────────────── -->
    <div *ngIf="isApprove" class="approver-section">
      <div class="approver-section__head">
        <app-draw-icon icon="pi pi-comment"></app-draw-icon>
        <span i18n="@@common.approverNotes">Approver Notes</span>
        <span class="approver-section__hint" i18n="@@common.requiredWhenRejecting">Required when rejecting</span>
      </div>
      <div class="form-field">
        <textarea pTextarea formControlName="approverNotes"
                  placeholder="Add your review notes here. Notes are mandatory when rejecting…"
                  i18n-placeholder="@@audit.observations.approverNotesPlaceholder"
                  [autoResize]="true" rows="4"
                  [class.ng-invalid]="isInvalid('approverNotes')"
                  [class.ng-touched]="isInvalid('approverNotes')"></textarea>
        <small *ngIf="isInvalid('approverNotes')" class="error-text" i18n="@@audit.observations.approverNotesRequired">
          {{ formErrors.ApproverNotesRequired }}
        </small>
      </div>
    </div>

  </form>

  <!-- FOOTER -->
  <div class="drawer-footer">
    <!-- Approve mode footer -->
    <ng-container *ngIf="isApprove">
      <p-button label="Cancel"
                i18n-label="@@common.cancel"
                styleClass="cancel-btn"
                (onClick)="onCancel()"
                type="button"></p-button>
      <div class="footer-approve-actions">
        <p-button label="Reject"
                  i18n-label="@@common.reject"
                  icon="pi pi-times"
                  styleClass="btn-reject"
                  (onClick)="onReject()"
                  type="button"></p-button>
        <p-button label="Approve"
                  i18n-label="@@common.approve"
                  icon="pi pi-check"
                  styleClass="btn-approve"
                  (onClick)="onApprove()"
                  type="button"></p-button>
      </div>
    </ng-container>

    <!-- Create / Edit mode footer -->
    <ng-container *ngIf="!isApprove">
      <p-button label="Cancel" i18n-label="@@common.cancel" styleClass="cancel-btn" (onClick)="onCancel()" type="button"></p-button>
      <p-button [label]="submitLabel" styleClass="submit-btn" type="submit" (onClick)="onSubmit()"></p-button>
    </ng-container>
  </div>

</div>
